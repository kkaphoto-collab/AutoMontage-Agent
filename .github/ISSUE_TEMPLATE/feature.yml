name: Идея или новая возможность
description: Предложить, что добавить или улучшить в монтаже, Review, пульте, курсе или документации.
title: "[Идея] "
labels: ["type:feature"]
projects: ["mcdenil-skills/1"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите идею простыми словами. Главное – какую проблему она решает, а не как её программировать.

        **Не вставляйте сюда** API-ключи, токены, пароли, личные данные, клиентские видео,
        исходники и рендеры. Репозиторий публичный.

  - type: textarea
    id: problem
    attributes:
      label: Какая проблема сейчас
      description: Что неудобно или невозможно сделать сегодня. Кому это мешает.
      placeholder: "Пример: чтобы заменить музыку в готовом ролике, приходится заново собирать весь preview."
    validations:
      required: true

  - type: textarea
    id: now
    attributes:
      label: Как это работает сейчас
      description: Что происходит сегодня, когда вы пытаетесь это сделать.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Как должно работать
      description: Опишите желаемый результат глазами пользователя.
      placeholder: "Пример: в пульте есть кнопка «Другая музыка», и через минуту готов новый preview."
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Какая польза
      description: "Что это даст: сэкономит время, уберёт ошибки, откроет новый тип роликов, упростит путь новичку."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Где это
      description: Выберите ближайшее. Если не уверены, выберите «Не знаю».
      options:
        - motion-kit
        - QA-гейты
        - Review
        - Пульт
        - Preview и рендер
        - Звук
        - Документация и курс
        - Тесты и CI
        - Инфраструктура
        - Не знаю
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Как понять, что готово
      description: По каким признакам вы решите, что идея реализована.
      placeholder: "Пример: новичок по курсу делает это сам, без помощи агента."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Другие варианты
      description: Если вы уже обходитесь чем-то другим или видите иной путь, опишите.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: В тексте нет ключей, паролей, личных данных, клиентских видео и личных путей.
          required: true
